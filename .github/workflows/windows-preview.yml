name: Windows preview
on:
  push:
    branches: [main]
    paths:
      - 'scripts/windows/**'
      - 'server/**'
      - 'src/**'
      - 'tests/**'
      - 'package*.json'
      - 'OPEN-PREVIEW.vbs'
      - 'START-WINDOWS.cmd'
      - '.github/workflows/windows-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      BSIGN_PREVIEW_FOLDER: 'BSIGN Preview ทดสอบ'
    steps:
      - uses: actions/checkout@v6
        with:
          path: source
      - name: Extract release ZIP into a folder with spaces and Thai characters
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'BSIGN-WEB-preview.zip'
          git -C source archive --format=zip --output=$archive HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:BSIGN_PREVIEW_FOLDER
      - name: Verify portable startup and cached restart
        shell: powershell
        working-directory: 'BSIGN Preview ทดสอบ'
        run: |
          try { & ./scripts/windows/preview.ps1 -SmokeTest }
          catch {
            $message = ($_.Exception.GetBaseException().Message + ' | ' + $_.ScriptStackTrace) -replace '[\r\n]+',' '
            Write-Host "::error title=Portable startup::$message"
            if (Test-Path '.runtime/logs/setup.log') {
              $tail = ((Get-Content '.runtime/logs/setup.log' -Tail 12) -join ' ') -replace '[\r\n]+',' '
              Write-Host "::error title=Setup output::$tail"
            }
            exit 1
          }
      - name: Verify Windows Forms controller
        shell: powershell
        working-directory: 'BSIGN Preview ทดสอบ'
        run: |
          try { & ./scripts/windows/preview.ps1 -UiSmokeTest }
          catch {
            $message = ($_.Exception.GetBaseException().Message + ' | ' + $_.ScriptStackTrace) -replace '[\r\n]+',' '
            Write-Host "::error title=Windows Forms::$message"
            exit 1
          }
      - name: Verify double-click launcher entry point
        shell: powershell
        working-directory: 'BSIGN Preview ทดสอบ'
        run: |
          $launcher = Join-Path $PWD 'OPEN-PREVIEW.vbs'
          $process = Start-Process wscript.exe -ArgumentList ('"' + $launcher + '" /test-ui') -PassThru
          if (-not $process.WaitForExit(120000)) { Stop-Process -Id $process.Id; throw 'Launcher timeout' }
          if ($process.ExitCode -ne 0) { throw "Launcher exit code: $($process.ExitCode)" }
      - name: API and persistence tests using bundled Node
        shell: powershell
        working-directory: 'BSIGN Preview ทดสอบ'
        run: |
          $node = Join-Path $PWD '.runtime/node-v24.22.1-win-x64/node.exe'
          $env:PATH = (Split-Path $node) + ';' + $env:PATH
          & $node --test --test-concurrency=1 tests/api.test.js tests/preview.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: First-admin setup in Windows Edge
        shell: powershell
        working-directory: 'BSIGN Preview ทดสอบ'
        run: |
          $node = Join-Path $PWD '.runtime/node-v24.22.1-win-x64/node.exe'
          $env:CHROMIUM_PATH = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          & $node tests/preview-browser.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
